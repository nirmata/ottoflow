{{- if and .Values.rbac.create .Values.serveA2A.enabled }}
# ClusterRole for "who can run an exposed Workflow over A2A". serve-a2a checks this permission with
# SubjectAccessReview in the Workflow's namespace after TokenReview establishes the caller's
# identity. Bind it with a RoleBinding in each exposed Workflow's namespace to the ServiceAccount
# of every caller (for a kagent agent, the ServiceAccount whose token is stored in the Secret
# referenced by headersFrom). No ConfigMap named a2a-caller needs to exist: the permission is the
# whole signal.
#
# Deliberately separate from mcp-caller and agent-executor-caller: each is a different grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ottoflow.fullname" . }}-a2a-caller
  labels:
    {{- include "ottoflow.labels.n4" . }}
    app.kubernetes.io/component: a2a-caller
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["a2a-caller"]
    verbs: ["get"]
{{- end }}
