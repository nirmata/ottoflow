{{- /*
Opt-in named-Secret access. OttoFlow ships with ZERO cluster-wide Secret access; operators grant
access to specific, named Secrets in TENANT namespaces by adding entries under
rbac.secretAccess.<component> — a LIST of {namespace, secretNames} so one release can serve many
tenants without per-tenant chart renders. Both lists are EMPTY by default, so nothing is rendered
until an operator opts in. Each Role grants only `get` scoped to the named Secrets
(resourceNames) — never a blanket secrets grant, never cluster-wide.

Each Role is created in its entry's .namespace, which must already exist at install/upgrade time
(Helm does not create tenant namespaces; see values.yaml). The binding subject is the component
ServiceAccount in the INSTALL namespace (a RoleBinding may reference a cross-namespace subject).
If an entry's .namespace is empty it resolves to the install namespace — but as blast-radius
hygiene workflow Secrets belong in a tenant namespace, not in the control-plane (install)
namespace. The template therefore FAILS in that case and steers the operator to a dedicated
tenant namespace. It also fails on two entries naming the same namespace for one component (they
would render same-named Roles and silently last-write-win; merge the secretNames instead). This
mirrors Kyverno's "extend via new roles, don't modify the shipped roles" pattern, but tighter:
named and namespaced. See docs/user/rbac-secret-access.md.

Rendered as a range over $components and each component's entries rather than one hardcoded block
per component, so a third component (or a different verb than `get`) is a values/entry change
here, not a template edit.
*/ -}}
{{- $ := . -}}
{{- $installNs := include "ottoflow.namespace" . -}}
{{- $components := list
  (dict "key" "controller" "nameSuffix" "controller-secret-access" "labelsTemplate" "ottoflow.labels.n4" "saTemplate" "ottoflow.serviceAccountName" "requireAgentExecutor" false)
  (dict "key" "agentExecutor" "nameSuffix" "agent-executor-secret-access" "labelsTemplate" "ottoflow.agentExecutor.labels.n4" "saTemplate" "ottoflow.agentExecutor.serviceAccountName" "requireAgentExecutor" true)
-}}
{{- $first := true -}}
{{- range $c := $components }}
{{- $entries := index $.Values.rbac.secretAccess $c.key | default (list) }}
{{- if not (kindIs "slice" $entries) }}
{{- fail (printf "rbac.secretAccess.%s must be a LIST of {namespace, secretNames} entries (one per tenant namespace), not a single object. See docs/user/rbac-secret-access.md." $c.key) }}
{{- end }}
{{- $seenNamespaces := dict }}
{{- range $entry := $entries }}
{{- if and $.Values.rbac.create (or (not $c.requireAgentExecutor) $.Values.agentExecutor.enabled) $entry.secretNames }}
{{- $ns := $entry.namespace | default $installNs }}
{{- if eq $ns $installNs }}
{{- fail (printf "a rbac.secretAccess.%s entry sets secretNames but resolves to the install namespace (%q). As blast-radius hygiene, workflow Secrets belong in a tenant namespace, not in the control-plane (install) namespace. Set that entry's namespace to a dedicated tenant namespace where your workflow Secrets live. See docs/user/rbac-secret-access.md." $c.key $installNs) }}
{{- end }}
{{- if hasKey $seenNamespaces $ns }}
{{- fail (printf "rbac.secretAccess.%s lists namespace %q more than once; merge the secretNames into a single entry per namespace." $c.key $ns) }}
{{- end }}
{{- $_ := set $seenNamespaces $ns true }}
{{- if not $first }}
---
{{- end }}
{{- $first = false }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ottoflow.fullname" $ }}-{{ $c.nameSuffix }}
  namespace: {{ $ns }}
  labels:
    {{- include $c.labelsTemplate $ }}
    app.kubernetes.io/component: rbac
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
    resourceNames:
      {{- range $entry.secretNames }}
      - {{ . | quote }}
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ottoflow.fullname" $ }}-{{ $c.nameSuffix }}
  namespace: {{ $ns }}
  labels:
    {{- include $c.labelsTemplate $ }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ottoflow.fullname" $ }}-{{ $c.nameSuffix }}
subjects:
  - kind: ServiceAccount
    name: {{ include $c.saTemplate $ }}
    namespace: {{ $installNs }}
{{- end }}
{{- end }}
{{- end }}
