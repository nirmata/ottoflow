# Deliberately-broken pods for the README pod-triage quickstart: a
# crash-looping (OOMKilled) pod, an ImagePullBackOff pod, and two healthy
# ones. Applied to the `default` namespace because pod-triage scans `default`.
#   crashy      — OOMKilled crash-looper: restartCount climbs, lastState OOMKilled
#   web-broken  — ImagePullBackOff: bad image tag, never starts (0 restarts)
#   healthy-web — healthy; never flagged (proves the filter excludes healthy pods)
#   healthy-api — healthy; never flagged
apiVersion: v1
kind: Pod
metadata:
  name: crashy
  namespace: default
spec:
  restartPolicy: Always
  containers:
    - name: crashy
      image: busybox
      command: ["sh", "-c", "tail /dev/zero"]   # allocates unbounded memory → OOMKilled
      resources:
        limits: {memory: "16Mi"}
        requests: {memory: "16Mi"}
---
apiVersion: v1
kind: Pod
metadata:
  name: web-broken
  namespace: default
spec:
  restartPolicy: Always
  containers:
    - name: web-broken
      image: nginx:no-such-tag-9z9z9z          # nonexistent tag → ImagePullBackOff
---
apiVersion: v1
kind: Pod
metadata:
  name: healthy-web
  namespace: default
spec:
  restartPolicy: Always
  containers:
    - name: healthy-web
      image: nginx:stable
---
apiVersion: v1
kind: Pod
metadata:
  name: healthy-api
  namespace: default
spec:
  restartPolicy: Always
  containers:
    - name: healthy-api
      image: nginx:stable
