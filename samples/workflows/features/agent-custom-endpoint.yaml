# Demonstrates Agent.spec.config: what it does, and — more importantly —
# what it does NOT do for each provider. Verified against the pinned gollm
# dependency, not assumed.
#
# PREREQUISITE: spec.config.endpoint is honored ONLY if the agent-executor
# operator has allowlisted its origin via the AGENT_LLM_ENDPOINT_ALLOWLIST
# process environment variable (Helm: agentExecutor.llmEndpointAllowlist).
# With the allowlist empty (the default), ANY non-empty spec.config.endpoint
# fails the agent run, for every provider. To run this sample as written:
#   helm upgrade --install ottoflow charts/ottoflow \
#     --namespace ottoflow \
#     --set-json 'agentExecutor.llmEndpointAllowlist=["https://my-aoai.internal.example.com"]'
#
# Listing an origin trusts it with the agent-executor's LLM credentials: any
# Agent may name a listed origin, and every provider client that uses the
# endpoint (with the pinned gollm, azure-openai) sends its credential there
# together with the full prompt. Do not allowlist a host you do not control.
#
# Agent.spec.config effectiveness by provider, once an origin IS allowlisted:
#   - endpoint (origin only, "scheme://host[:port]"; a path, query, fragment
#     or user:pass@ is rejected):
#       * azure-openai (gollm azopenai provider, azopenai.go:62-64): honored.
#         Overrides AZURE_OPENAI_ENDPOINT. The endpoint must be https://,
#         because the client forces the scheme to https.
#       * openai: IGNORED. openai instead takes its base URL from the
#         OPENAI_ENDPOINT or OPENAI_API_BASE process environment variable
#         (set via the agent-executor pod's env, e.g. Helm
#         `agentExecutor.env`).
#       * gemini / anthropic: IGNORED entirely.
#       * local: IGNORED — the local (llama.cpp) provider uses LLAMACPP_HOST
#         instead (see agent-local-llamacpp.yaml).
#   - skipVerifySSL:
#       * "true" is REJECTED for every provider, regardless of the allowlist:
#         the agent run fails. To reach an endpoint with a private CA, mount
#         the CA bundle and set SSL_CERT_FILE or SSL_CERT_DIR on the
#         agent-executor process instead (keeps TLS verification on). As a
#         last resort, set LLM_SKIP_VERIFY_SSL=true on that process, a
#         process-wide setting not scoped to this Agent.
#   - apiKey / baseURL / apiVersion / projectId (other Agent.spec.config
#     fields, if present in your CRD version): NEVER read by the executor
#     for any provider today — credentials always come from the
#     agent-executor pod's process environment (os.Getenv), not from
#     Agent.spec.config.
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: Agent
metadata:
  name: azure-proxy-agent
  namespace: ottoflow
spec:
  prompt: "You are a helpful AI assistant. Answer questions clearly and concisely."
  modelProvider: azure-openai
  modelName: gpt-4o
  config:
    # Honored only because this origin is listed in
    # agentExecutor.llmEndpointAllowlist (see the header). Overrides
    # AZURE_OPENAI_ENDPOINT for the azopenai provider.
    endpoint: "https://my-aoai.internal.example.com"
  outputExtraction:
    type: text
---
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: Agent
metadata:
  name: openai-proxy-agent
  namespace: ottoflow
spec:
  prompt: "You are a helpful AI assistant. Answer questions clearly and concisely."
  modelProvider: openai
  modelName: gpt-4o
  # config.endpoint is deliberately omitted: it is ignored for openai even
  # when allowlisted; see the working alternative below. config.skipVerifySSL
  # is rejected for every provider (see the header).
  # To point the openai provider at a proxy/custom base URL, config.endpoint
  # will NOT work. Instead set OPENAI_ENDPOINT or OPENAI_API_BASE on the
  # agent-executor pod via Helm:
  #   helm upgrade --install ottoflow charts/ottoflow \
  #     --namespace ottoflow \
  #     --set-json 'agentExecutor.env=[{"name":"OPENAI_API_BASE","value":"https://my-openai-proxy.internal.example.com/v1"}]'
  # NOTE: OPENAI_BASE_URL is not forwarded by ottoflow (it is not in
  # LLMEnvAllowlist), and gollm's openai provider never reads that name.
  outputExtraction:
    type: text
---
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: Workflow
metadata:
  name: agent-custom-endpoint-workflow
  namespace: ottoflow
spec:
  inputs:
    - name: question
      description: "Question to ask"
      default: "What is Kubernetes?"
  steps:
    - name: askAgent
      message: "Ask agent (azure-openai provider; endpoint allowlisted via agentExecutor.llmEndpointAllowlist)"
      agentRef:
        name: azure-proxy-agent
        additionalPrompts:
          - 'inputs.question'
      outputs:
        - name: answer
          expression: 'agentResponse'
  # Step outputs land in the shared `variables` map, hence variables.answer
  outputs:
    - name: result
      expression: 'variables.answer'
---
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: WorkflowRun
metadata:
  name: agent-custom-endpoint-run-001
  namespace: ottoflow
spec:
  workflowRef:
    name: agent-custom-endpoint-workflow
  inputValues:
    question: "Explain Kubernetes in simple terms"
