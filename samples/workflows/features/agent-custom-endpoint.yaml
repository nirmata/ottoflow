# Demonstrates Agent.spec.config: what it does, and — more importantly —
# what it does NOT do for each provider. Verified against the pinned gollm
# dependency, not assumed.
#
# PREREQUISITE: spec.config.endpoint is honored ONLY if the agent-executor
# operator has pre-approved its origin via the AGENT_LLM_ENDPOINT_ALLOWLIST
# process environment variable (Helm: agentExecutor.llmEndpointAllowlist).
# An unset/empty allowlist rejects ANY non-empty spec.config.endpoint and
# fails the agent run, for every provider, before this Agent's endpoint is
# even parsed. To run this sample as written:
#   helm upgrade --install ottoflow charts/ottoflow \
#     --namespace ottoflow \
#     --set-json 'agentExecutor.llmEndpointAllowlist=["https://my-aoai.internal.example.com"]'
#
# LISTING AN ORIGIN IS A FULL-CREDENTIAL TRUST DECISION, NOT A PER-PROVIDER
# ONE: the allowlist is provider-agnostic, so ANY Agent's modelProvider can
# be pointed at a listed origin, and that host then receives WHATEVER LLM
# credential is present in the agent-executor pod, together with the full
# prompt. Do not allowlist a host you do not control.
#
# Agent.spec.config effectiveness by provider, once an origin IS allowlisted:
#   - endpoint:
#       * azure-openai (gollm azopenai provider, azopenai.go:62-64): honored.
#         Overrides AZURE_OPENAI_ENDPOINT. NOTE: the scheme is FORCED to
#         https regardless of what you set here.
#       * openai: IGNORED. openai instead takes its base URL from the
#         OPENAI_ENDPOINT or OPENAI_API_BASE process environment variable
#         (set via the agent-executor pod's env, e.g. Helm
#         `agentExecutor.env`). OPENAI_BASE_URL is in ottoflow's
#         LLMEnvAllowlist (exec_client.go:64) but gollm's openai provider
#         never reads that name — it is effectively dead for this purpose.
#       * gemini / anthropic: IGNORED entirely.
#       * local: IGNORED — the local (llama.cpp) provider uses LLAMACPP_HOST
#         instead (see agent-local-llamacpp.yaml), even when allowlisted.
#   - skipVerifySSL:
#       * REJECTED for every provider, regardless of the allowlist above:
#         the agent-executor's LLM credential is process-global, so a
#         tenant-authored Agent may not turn off TLS verification for
#         requests carrying it. Setting it to "true" fails the agent run.
#         To reach an endpoint with a private CA, mount the CA bundle and
#         set SSL_CERT_FILE or SSL_CERT_DIR on the agent-executor process
#         instead (keeps TLS verification ON). As a last resort, set
#         LLM_SKIP_VERIFY_SSL=true on the agent-executor process, which
#         disables verification for ALL LLM egress from that pod, not just
#         this Agent.
#   - apiKey / baseURL / apiVersion / projectId (other Agent.spec.config
#     fields, if present in your CRD version): NEVER read by the executor
#     for any provider today — credentials always come from the
#     agent-executor pod's process environment (os.Getenv), not from
#     Agent.spec.config.
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: Agent
metadata:
  name: azure-proxy-agent
  namespace: ottoflow
spec:
  prompt: "You are a helpful AI assistant. Answer questions clearly and concisely."
  modelProvider: azure-openai
  modelName: gpt-4o
  config:
    # Honored only because "https://my-aoai.internal.example.com" is listed
    # in agentExecutor.llmEndpointAllowlist above (origin match: scheme +
    # host, path/query ignored on the allowlist entry itself). Overrides
    # AZURE_OPENAI_ENDPOINT for the azopenai provider. The scheme is forced
    # to https no matter what is written here.
    endpoint: "https://my-aoai.internal.example.com"
  outputExtraction:
    type: text
---
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: Agent
metadata:
  name: openai-proxy-agent
  namespace: ottoflow
spec:
  prompt: "You are a helpful AI assistant. Answer questions clearly and concisely."
  modelProvider: openai
  modelName: gpt-4o
  # config.endpoint is deliberately omitted here — it would be IGNORED for
  # the openai provider even if its origin were allowlisted; see the
  # working alternative below. config.skipVerifySSL is REJECTED for every
  # provider (see the file header) — do not set it here either.
  #
  # To point the openai provider at a proxy/custom base URL, config.endpoint
  # will NOT work. Instead set OPENAI_ENDPOINT or OPENAI_API_BASE on the
  # agent-executor pod via Helm:
  #   helm upgrade --install ottoflow charts/ottoflow \
  #     --namespace ottoflow \
  #     --set-json 'agentExecutor.env=[{"name":"OPENAI_API_BASE","value":"https://my-openai-proxy.internal.example.com/v1"}]'
  # NOTE: OPENAI_BASE_URL is listed in ottoflow's LLMEnvAllowlist but is
  # dead for this purpose — gollm's openai provider never reads that name.
  outputExtraction:
    type: text
---
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: Workflow
metadata:
  name: agent-custom-endpoint-workflow
  namespace: ottoflow
spec:
  inputs:
    - name: question
      description: "Question to ask"
      default: "What is Kubernetes?"
  steps:
    - name: askAgent
      message: "Ask agent (azure-openai provider; endpoint allowlisted via agentExecutor.llmEndpointAllowlist)"
      agentRef:
        name: azure-proxy-agent
        additionalPrompts:
          - 'inputs.question'
      outputs:
        - name: answer
          expression: 'agentResponse'
  # Step outputs land in the shared `variables` map, hence variables.answer
  outputs:
    - name: result
      expression: 'variables.answer'
---
apiVersion: ottoflow.nirmata.io/v1alpha1
kind: WorkflowRun
metadata:
  name: agent-custom-endpoint-run-001
  namespace: ottoflow
spec:
  workflowRef:
    name: agent-custom-endpoint-workflow
  inputValues:
    question: "Explain Kubernetes in simple terms"
