apiVersion: ottoflow.nirmata.io/v1alpha1
kind: Agent
metadata:
  name: analysis-agent
  namespace: ottoflow
spec:
  # Prompt can use CEL expressions to reference workflow context
  # Use string concatenation to build dynamic prompts
  prompt: |
    You are an expert Kubernetes analyst. Analyze the provided deployment information
    and provide recommendations for optimization.
    
    Provide recommendations for:
    1. Resource optimization
    2. High availability improvements
    3. Security best practices
    
    Format your response as JSON with keys: recommendations, priority, and actionItems.
  modelProvider: local
  # "local" targets a llama.cpp-compatible server (llama.cpp, ollama, vLLM, LM Studio) so
  # this sample runs without a cloud API key. The server address comes from the
  # LLAMACPP_HOST environment variable, NOT from spec.config -- the underlying client does
  # not read spec.config.endpoint. For ollama:
  #   LLAMACPP_HOST=http://127.0.0.1:11434/ ottoflow run <workflow> --model <your-model>
  # Or switch modelProvider to openai / anthropic / google with credentials.
  # modelName: ""  # Uses default model if not specified
  outputExtraction:
    type: json
    pattern: "$.recommendations"
  # serviceAccount: ""  # Optional: specify service account for RBAC

