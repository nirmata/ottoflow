      openAPIV3Schema:
        description: |-
          Workflow is the Schema for the workflows API
          Workflow is an immutable template that defines steps, inputs, and optional triggers.
          It has no execution status - it acts as a reusable blueprint.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkflowSpec defines the desired state of Workflow
            properties:
              celCostLimit:
                description: |-
                  CELCostLimit is the maximum cost budget for CEL expression evaluation in this workflow.
                  If unset, a default (~2MB-equivalent) is used. Increase for workflows that do large data joins.
                format: int64
                type: integer
              events:
                description: Events configures Kubernetes event emission for this
                  workflow.
                properties:
                  enabled:
                    description: |-
                      Enabled turns Kubernetes event emission on or off. When nil or true, events are emitted per Level.
                      When false, no events are emitted.
                    type: boolean
                  level:
                    default: WorkflowAndSteps
                    description: |-
                      Level controls which events are emitted when Enabled is true.
                      - Workflow: workflow-level only (WorkflowRunning, WorkflowSucceeded, WorkflowFailed, WorkflowRestarted)
                      - WorkflowAndSteps: workflow-level and step-level (WorkflowExecution for step started/succeeded/failed/skipped)
                    enum:
                    - Workflow
                    - WorkflowAndSteps
                    type: string
                type: object
              execution:
                description: |-
                  Execution is the default execution spec for WorkflowRuns created from this Workflow (e.g. by cron).
                  When the scheduler creates a WorkflowRun, it copies this into the run's spec so runner Jobs get
                  the same env, volumes, etc. Use this to inject Nirmata LLM credentials (valueFrom.secretKeyRef).
                properties:
                  checkpointing:
                    description: |-
                      Checkpointing configures per-step checkpointing for crash recovery.
                      When enabled, the executor writes a ConfigMap checkpoint after each successful step.
                      The controller retries transient pod failures (eviction, node drain) up to
                      MaxRestartAttempts times; deterministic failures (OOMKilled) never retry.
                    properties:
                      enabled:
                        description: |-
                          Enabled turns on per-step checkpointing. After each step completes, the executor
                          writes a checkpoint ConfigMap so the run can resume after a transient pod crash.
                          Default: false — preserves existing behavior for all existing workflows.
                        type: boolean
                      maxRestartAttempts:
                        description: |-
                          MaxRestartAttempts is the maximum number of times the controller will create a new
                          runner Job after a transient pod failure. Deterministic failures (OOMKilled) never
                          retry regardless of this value.
                          Default: 3.
